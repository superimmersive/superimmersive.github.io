<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a model — Superimmersive</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #020617;
      color: #f8fafc;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { width: min(32rem, calc(100% - 2rem)); margin: 0 auto; padding: 2.5rem 0 4rem; }
    h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.35rem; }
    p { margin: 0; color: #94a3b8; }
    label { display: block; margin: 1.1rem 0 0.35rem; font-size: 0.85rem; color: #94a3b8; }
    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.75rem;
      border-radius: 10px;
      border: 1px solid rgba(248, 250, 252, 0.16);
      background: transparent;
      color: inherit;
      font: inherit;
    }
    input[type="file"] { color: #94a3b8; max-width: 100%; }
    button {
      margin-top: 1.25rem;
      padding: 0.75rem 1.15rem;
      border: 0;
      border-radius: 999px;
      background: #7e9fc0;
      color: #0a1420;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: progress; }
    #status { margin-top: 1rem; min-height: 1.5rem; }
    #status.error { color: #f0b4b4; }
    #qr { margin-top: 1.25rem; }
    #qr[hidden] { display: none; }
    #qr canvas { display: block; width: 220px; height: 220px; border-radius: 12px; }
    #qr a { display: inline-block; margin-top: 0.75rem; color: #f8fafc; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>Add a model</h1>
    <p>Stores the USDZ in private model storage.</p>
    <form id="app">
      <label for="name">Name</label>
      <input id="name" type="text" maxlength="120" autocomplete="off" required placeholder="Garden lamp">
      <label for="usdz">USDZ</label>
      <input id="usdz" type="file" accept=".usdz,model/vnd.usdz+zip" required>
      <div><button id="publish" type="submit">Publish</button></div>
      <p id="status" role="status"></p>
      <div id="qr" hidden>
        <canvas id="qr-canvas" width="220" height="220" aria-label="App Clip QR code"></canvas>
        <a id="qr-link" href=""></a>
      </div>
    </form>
  </main>
  <script src="../../js/qrcode.min.js"></script>
  <script src="intake.js"></script>
</body>
</html>
